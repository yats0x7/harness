[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memo"
version = "2.1.0"
description = "In-process LRU cache with per-entry TTL, a memoize decorator and a session store"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["memo"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
