[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wrench"
version = "0.1.0"
description = "An autonomous coding-agent harness for text-only foundation models"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25",
    "rich>=13",
    "textual>=0.60",
    "tomli>=2; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wrench = "wrench.__main__:main"

[tool.setuptools.packages.find]
include = ["wrench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
